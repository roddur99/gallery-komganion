[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gallery-komganion"
version = "0.1.0"
description = "Personal image-gallery server for Android readers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic-settings",
    "pillow",
    "watchdog",
    "pyjwt",
    "argon2-cffi",
    "python-multipart",
]

[project.scripts]
gallery-komganion = "gallery_komganion.cli:main"

[project.gui-scripts]
gallery-komganion-ui = "gallery_komganion.ui:main"

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
    "pytest-cov",
    "ruff",
]
packaging = [
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"